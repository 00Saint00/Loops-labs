    <script>
      // The home hero photo is the largest thing on the landing page; start fetching it
      // before React renders. Other routes skip this so they don't download it for nothing.
      if (location.pathname === '/') {
        var hero = document.createElement('link')
        hero.rel = 'preload'
        hero.as = 'image'
        hero.fetchPriority = 'high'
        hero.imageSrcset =
          '/images/products/ocean-breeze-cardigan-480.webp 480w, /images/products/ocean-breeze-cardigan-960.webp 960w'
        hero.imageSizes = '(max-width: 767px) 100vw, 50vw'
        document.head.appendChild(hero)
      }
    </script>
